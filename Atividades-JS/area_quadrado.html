

<script>
    let base = Number(prompt('Defina a base do seu quadrado:'));
    let altura = Number(prompt('Defina a altura do seu quadrado (deve ser o mesmo número da base):'));

    if (base !== altura) { 
        //as chaves vão servir para as funçoes verdadeiras e falsas do código
        alert('Para formar um quadrado, os 4 lados devem ter o mesmo comprimento.');
    } else {         
        // o else serve para caso a if seja falsa pois ai ele seguiria o código normalmente :)
        let area = base * altura;
        alert('Área do quadrado: ' + area);
    }
</script>
