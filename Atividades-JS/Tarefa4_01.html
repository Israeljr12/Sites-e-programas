<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script>
function testaValor() {

let valor = document.getElementById("valor").value ;
let resposta = document.getElementById("resposta");

valor = Number(valor);

if (valor > 10){
    resposta.textContent = valor = " é maior que 10";
}
}

   </script>
   <title>Teste valor entrado!</title>
 
</head>
<body>
    <form>
<p><label>Entre com um valor inteiro: <input type="text" name = "valor" id="valor"></label></p>
<input type="button" value="Submit" onclick="testaValor()">
</form>
<p id="resposta"></p>
</body> 
</html>
