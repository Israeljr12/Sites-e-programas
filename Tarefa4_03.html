<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch em Javascript</title>

    <script>
        function parOuImpar(){

            let n = document.getElementById("n").value;
            let f = document.getElementById("f");
            let resposta = document.getElementById("resposta");

            n = Number(n);

            if (n % 2 ==0){
                resposta.textContent = "par";
            }
            else{
                resposta.textContent = "ímpar";
            }
            f.textContent = "fim do programa";
        }
    </script>
</head>
<body>
    <form>
        <p><label>entre com um valor numérico : <input type="text" name="n" id="n"></label></p>

        <input type="button" value="Submit" onclick="parOuImpar()">
    </form>
    <p id="resposta"></p>
    <p id="f"></p>
</body>
</html>
