<script>

let salario = Number(prompt("Digite seu salário atual:"));
let percentual = Number(prompt("Digite o percentual do seu aumento:"));

let aumento = (salario * percentual)/100;

alert ("Seu novo salário é: "+ (aumento + salario));
//inicialmente eu havia criado uma nova var para somar o salario com o aumento
//mas colocando entre parenteses (aumento + salario) poupei esta variavel 

</script>
